
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#520b17">
<title>Verai Academy | The Characters</title>

<style>
:root {
  --bg: #31050d;
  --crimson: #650d1b;
  --gold: #e6c36a;
  --light-gold: #ffe9a6;
  --white: #fff5df;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--white);
  font-family: Georgia, "Times New Roman", serif;
  background:
    radial-gradient(ellipse at top, #751528 0%, transparent 55%),
    linear-gradient(145deg, #26030a, #520b17 55%, #31050d);
}

body::before {
  content: "";
  position: fixed;
  inset: 10px;
  border: 1px solid #e6c36a77;
  pointer-events: none;
}

header {
  text-align: center;
  padding: 55px 12px 35px;
}

h1 {
  margin: 0;
  font-size: clamp(30px, 7vw, 55px);
  font-variant: small-caps;
  letter-spacing: 3px;
  color: var(--light-gold);
  text-shadow: 0 0 18px #e6c36a33;
}

.ornament {
  margin: 18px 0;
  color: var(--gold);
  letter-spacing: 8px;
}

h2 {
  margin: 0;
  color: var(--gold);
  font-size: clamp(17px, 4vw, 25px);
  letter-spacing: 5px;
  font-weight: normal;
}

.line {
  width: 70%;
  max-width: 350px;
  height: 1px;
  margin: 25px auto 0;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

main {
  width: 92%;
  max-width: 1000px;
  margin: 0 auto;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.character {
  min-width: 0;
  min-height: 145px;
  padding: 18px 5px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
  text-align: center;
  text-decoration: none;
  color: var(--white);
  background: linear-gradient(145deg, #791426, #410712);
  border: 1px solid var(--gold);
  outline: 1px solid #e6c36a33;
  outline-offset: -6px;
  border-radius: 3px;
  transition: .2s ease;
}

.character:hover,
.character:focus-visible {
  background: linear-gradient(145deg, #941d36, #590b1b);
  border-color: var(--light-gold);
  transform: translateY(-4px);
}

.symbol {
  color: var(--gold);
  font-size: 14px;
}

.english {
  font-size: clamp(13px, 2.5vw, 19px);
  font-weight: bold;
}

.japanese {
  font-family: "Yu Mincho", serif;
  color: var(--light-gold);
  font-size: clamp(12px, 2.2vw, 16px);
  overflow-wrap: anywhere;
}

.yamigami {
  grid-column: 2;
}

footer {
  padding: 40px 12px 45px;
  text-align: center;
  color: var(--light-gold);
  font-size: 13px;
  letter-spacing: 2px;
}

.footer-line {
  width: 70%;
  max-width: 350px;
  height: 1px;
  margin: 0 auto 22px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

@media (max-width: 480px) {
  .grid { gap: 9px; }
  .character { min-height: 125px; }
  footer { letter-spacing: 1px; }
}
</style>
</head>

<body>

<header>
  <h1>Verai Academy</h1>
  <div class="ornament">✦ ── ✧ ── ✦</div>
  <h2>The Characters</h2>
  <div class="line"></div>
</header>

<main>
  <div class="grid">

    <a class="character" href="character.html?id=hina">
      <span class="symbol">✦</span>
      <span class="english">Hina Sakurai</span>
      <span class="japanese">ヒナ・サクライ</span>
    </a>

    <a class="character" href="character.html?id=kamika">
      <span class="symbol">✦</span>
      <span class="english">Kamika Kiras</span>
      <span class="japanese">カミカ・キラス</span>
    </a>

    <a class="character" href="character.html?id=marie">
      <span class="symbol">✦</span>
      <span class="english">Marie Smith</span>
      <span class="japanese">マリー・スミス</span>
    </a>

    <a class="character" href="character.html?id=takami">
      <span class="symbol">✦</span>
      <span class="english">Takami Verai</span>
      <span class="japanese">高見フェリア</span>
    </a>

    <a class="character" href="character.html?id=lily">
      <span class="symbol">✦</span>
      <span class="english">Lily</span>
      <span class="japanese">リリィ</span>
    </a>

    <a class="character" href="character.html?id=spyion">
      <span class="symbol">✦</span>
      <span class="english">Spyion</span>
      <span class="japanese">スパイオン</span>
    </a>

    <a class="character yamigami"
       href="character.html?id=yamigami">
      <span class="symbol">✦</span>
      <span class="english">Yamigami</span>
      <span class="japanese">ヤミガミ</span>
    </a>

  </div>
</main>

<footer>
  <div class="footer-line"></div>
  Verai academy world by anya sensei
</footer>

</body>
</html>
